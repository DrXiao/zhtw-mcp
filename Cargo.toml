[package]
name = "zhtw-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "MCP server for Traditional Chinese (zh-TW) text linting and normalization"
license = "MIT"
repository = "https://github.com/sysprog21/zhtw-mcp"
homepage = "https://github.com/sysprog21/zhtw-mcp"
categories = ["command-line-utilities", "text-processing", "internationalization"]
keywords = ["mcp", "chinese", "linting", "traditional-chinese", "zh-tw"]
readme = "README.md"
include = ["src/**/*", "assets/ruleset.json", "scripts/schema-facts.json", "Cargo.toml", "LICENSE", "README.md", "rust-toolchain.toml"]

# Pinned OpenCC dictionary source for scripts/gen-s2t-tables.py.  Kept here,
# not in the script, so the dependency is declared where every other pinned
# dependency of this crate lives and `cargo metadata` can report it.
#
# To bump: change `commit`, run `python3 scripts/gen-s2t-tables.py`, and paste
# the printed source hash into `source-hash`.  The script refuses to generate
# if only one of the two moved, so a bump cannot be half-applied.
[package.metadata.opencc]
repository = "https://github.com/BYVoid/OpenCC"
commit = "5249273a3e5606852f088c9a8b23522145d94f78"
source-hash = "959b88f60c9dcc0d"

[features]
default = ["native", "translate"]
native = [
    "dep:dirs",
    "dep:fs2",
    "dep:rayon",
    "dep:rmcp",
    "dep:tempfile",
    "dep:tokio",
    "dep:toml",
]
browser-wasm = ["dep:console_error_panic_hook", "dep:wasm-bindgen"]
translate = ["dep:ureq", "dep:urlencoding"]

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "zhtw-mcp"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
aho-corasick = "1"
daachorse = "1"
regex = "1"
blake3 = "1"
rayon = { version = "1", optional = true }
anyhow = "1"
unicode-normalization = "0.1"
pulldown-cmark = { version = "0.13", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
dirs = { version = "5.0", optional = true }
tempfile = { version = "3.0", optional = true }
toml = { version = "0.8", optional = true }
ureq = { version = "3", optional = true }
urlencoding = { version = "2", optional = true }
rustc-hash = "2"
fs2 = { version = "0.4", optional = true }
postcard = { version = "1", default-features = false, features = ["alloc"] }
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
rmcp = { version = "3", default-features = false, features = [
    "server",
    "transport-io",
], optional = true }
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "rt",
    "sync",
    "time",
], optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
# Only for `start_paused`, which lets the 30s drain timeout be tested without
# waiting 30s. Resolver v2 keeps a dev-only feature out of the release binary.
tokio = { version = "1", features = ["test-util"] }

[[bench]]
name = "scanner"
harness = false

[[bench]]
name = "startup"
harness = false

[profile.release]
lto = true
strip = true

# Config for CI release builds via cargo-dist
[profile.dist]
inherits = "release"

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
unix-archive = ".tar.gz"
checksum = "sha256"
github-build-setup = "../build-setup.yml"
pr-run-mode = "skip"
plan-jobs = ["./main"]

[workspace.metadata.dist.github-custom-runners.aarch64-unknown-linux-gnu]
runner = "ubuntu-24.04"
host = "x86_64-unknown-linux-gnu"

[workspace.metadata.dist.github-custom-runners.aarch64-unknown-linux-musl]
runner = "ubuntu-24.04"
host = "x86_64-unknown-linux-gnu"
