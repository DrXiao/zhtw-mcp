name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v1-rust"
        shared-key: ${{ matrix.os }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: make check
      run: make check

  # Reads Cargo.lock against the RustSec advisory DB. Deliberately has no
  # Swatinem/rust-cache step: this job never compiles the workspace, and sharing
  # the check job's cache key would let it save an empty target/ tree over the
  # real cache.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Install cargo-audit
      uses: taiki-e/install-action@cargo-audit

    - name: cargo audit
      run: cargo audit

  check-size:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      run: rustup toolchain install stable --profile minimal

    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        prefix-key: "v1-rust"
        shared-key: "ubuntu-24.04"

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: make check-size
      run: make check-size
